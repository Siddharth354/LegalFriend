[project]
name = "legalfriend-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.140.0",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.9",
    "orjson>=3.11.9",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.18.0",
    "sarvamai>=0.1.28",
    "sentence-transformers>=5.6.1",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "torch>=2.13.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.0",
    "ty>=0.0.63",
]

[tool.ruff.lint.per-file-ignores]
"src/modules/legal_notice/features/analyze/logic.py" = ["BLE001"]

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
